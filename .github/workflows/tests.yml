# Runs the offline test suite (no Gnani key, no credits) on every push, on the README's setup.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4      # tests/worklet_check.mjs checks the browser audio worklet
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q -p no:warnings
      - name: Detector evaluation (saved transcripts)
        run: python eval_detector.py
