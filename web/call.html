<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scam Sentinel">

<title>Scam Sentinel protected line</title>
<script src="/common.js"></script>
<style>
  :root { --bg:#0b1416; --bg2:#112023; --card:#16282b; --line:#24393c; --ink:#f2f5f4; --ink2:#a9bcb8; --muted:#7f948f;
          --good:#19b37d; --warn:#f5a524; --bad:#e5484d; --accent:#3b8cf0; --risk:var(--good); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:radial-gradient(120% 60% at 50% 0%, #15302f 0%, var(--bg) 60%) fixed, var(--bg); color:var(--ink);
         font:18px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Kannada","Noto Sans Devanagari",sans-serif; }
  main { max-width:520px; min-height:100%; margin:0 auto; padding:max(14px, env(safe-area-inset-top)) 16px 28px; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:4px 0 14px; }
  header img { width:36px; height:36px; border-radius:9px; }
  header b { font-size:19px; letter-spacing:.01em; }
  .pill { margin-left:auto; font-size:12px; color:var(--ink2); border:1px solid var(--line); border-radius:20px; padding:3px 9px; white-space:nowrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin:10px 0; }
  h2 { font-size:22px; margin:2px 0 6px; } .note { color:var(--ink2); font-size:14px; } .hidden { display:none !important; }
  button { font:inherit; width:100%; border:0; border-radius:16px; padding:18px; font-size:21px; font-weight:700; color:#fff; cursor:pointer; margin:8px 0; }
  button:disabled { opacity:.45; }
  .go { background:var(--good); box-shadow:0 8px 24px -10px var(--good); } .stopbtn { background:var(--bad); } .ghost { background:transparent; border:1px solid var(--line); color:var(--ink2); font-size:16px; padding:12px; }

  /* role picker */
  .role { display:flex; gap:14px; align-items:center; text-align:left; background:var(--card); border:1px solid var(--line); padding:16px; }
  .role span.i { font-size:30px; width:48px; height:48px; display:grid; place-items:center; background:var(--bg2); border-radius:14px; flex:none; }
  .role small { display:block; color:var(--ink2); font-weight:400; font-size:14px; }

  /* setup */
  .label { color:var(--ink2); font-size:14px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.05em; }
  .langs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .langs button { margin:0; padding:14px 4px; font-size:19px; background:var(--bg2); border:1px solid var(--line); }
  .langs button.on { background:var(--accent); border-color:var(--accent); }
  .toggle { display:flex; gap:12px; align-items:center; padding:14px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; margin-top:8px; cursor:pointer; font-size:17px; }
  .toggle input { appearance:none; width:50px; height:30px; border-radius:15px; background:#33494c; position:relative; flex:none; margin:0; transition:background .2s; }
  .toggle input::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .2s; }
  .toggle input:checked { background:var(--good); } .toggle input:checked::after { left:23px; }
  .toggle small { color:var(--ink2); display:block; font-size:13px; }

  /* in call */
  #incall { flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
  #who2 { color:var(--ink2); font-size:16px; margin-top:6px; }
  #timer { font-variant-numeric:tabular-nums; color:var(--ink2); font-size:17px; min-height:24px; }
  .orb { position:relative; width:210px; height:210px; margin:26px 0 14px; display:grid; place-items:center; }
  .orb .core { width:150px; height:150px; border-radius:50%; background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--risk) 60%, #fff 0%), color-mix(in srgb, var(--risk) 55%, #000)); display:grid; place-items:center; font-size:64px; box-shadow:0 0 60px -6px var(--risk); transition:background .5s, box-shadow .5s; z-index:1; }
  .orb .ring { position:absolute; inset:0; border-radius:50%; border:3px solid var(--risk); opacity:0; animation:pulse 2.4s ease-out infinite; }
  .orb .ring:nth-child(2) { animation-delay:1.2s; }
  body[data-level="high"] .orb .ring { animation-duration:1s; }
  @keyframes pulse { 0% { transform:scale(.7); opacity:.8; } 100% { transform:scale(1.15); opacity:0; } }
  #risktext { font-size:26px; font-weight:800; color:var(--risk); transition:color .5s; }
  #status { font-size:16px; color:var(--ink2); margin-top:4px; }
  .meter { width:100%; max-width:300px; height:8px; background:var(--bg2); border-radius:4px; overflow:hidden; margin:12px auto 0; }
  .meter > div { height:100%; width:0; background:var(--risk); transition:width .5s, background .5s; }
  .chip { display:inline-block; margin-top:12px; font-size:15px; color:#a6efd0; background:#11372d; border-radius:20px; padding:6px 12px; }
  #alerts { width:100%; margin-top:14px; text-align:left; }
  #alerts .a { border-radius:16px; padding:14px 16px; margin:8px 0; font-size:18px; border-left:6px solid; }
  #alerts .medium { background:#3a2d0f; border-color:var(--warn); } #alerts .high { background:#3d1517; border-color:var(--bad); }
  #alerts .a small { display:block; color:var(--ink2); font-size:14px; margin-top:4px; }
  .callbar { margin-top:auto; padding-top:20px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #hang { width:78px; height:78px; border-radius:50%; padding:0; display:grid; place-items:center; background:var(--bad); box-shadow:0 10px 30px -8px var(--bad); }
  #hang:disabled { opacity:.35; }
  #hanglabel { color:var(--ink2); font-size:15px; }

  /* overlays */
  .overlay { display:none; position:fixed; inset:0; z-index:10; padding:max(28px, env(safe-area-inset-top)) 22px 28px; color:#fff; flex-direction:column; justify-content:center; text-align:center; gap:14px; overflow:auto; }
  .overlay.show { display:flex; animation:pop .25s ease-out; }
  .overlay > * { width:100%; max-width:480px; margin-inline:auto !important; }
  @keyframes pop { from { opacity:0; transform:scale(1.04); } }
  #banner { background:linear-gradient(180deg,#c1272d,#8e1418); }
  #stop { background:linear-gradient(180deg,#8e1418,#4f0a0c); z-index:11; }
  .overlay .big { font-size:40px; font-weight:900; line-height:1.12; }
  #stop .big { font-size:64px; }
  .overlay .msg { font-size:20px; }
  .overlay .type { font-size:22px; font-weight:800; background:rgba(0,0,0,.25); border-radius:14px; padding:10px; }
  .overlay a, .overlay button { display:block; background:#fff; color:#a3161b; text-decoration:none; border-radius:16px; padding:17px; font-size:21px; font-weight:800; margin:0; }
  .overlay .soft { background:rgba(255,255,255,.14); color:#fff; font-weight:600; font-size:17px; }

  /* after the call */
  #after h2 { font-size:22px; } #after .type { font-weight:700; color:var(--warn); margin:0 0 10px; }
  .yn { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .steps a, .steps div { display:block; background:var(--bg2); border:1px solid var(--line); color:var(--ink); text-decoration:none; border-radius:14px; padding:14px; margin:8px 0; font-size:18px; }
  .steps a { border-color:var(--accent); }
  .steps.urgent a:first-child { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:700; }
  .tricks { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px; min-height:4px; }
  .trick { font-size:15px; padding:7px 12px; border-radius:20px; background:color-mix(in srgb, var(--risk) 22%, var(--card));
           border:1px solid color-mix(in srgb, var(--risk) 60%, transparent); animation:chip .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes chip { from { transform:scale(.4); opacity:0; } }
  .trickhead { color:var(--ink2); font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin-top:14px; }
  .overlay .tip { font-size:19px; font-weight:700; background:rgba(255,255,255,.16); border-radius:14px; padding:12px; }
  .contact { display:grid; grid-template-columns:1fr 1.4fr; gap:8px; }
  .contact input { width:100%; padding:13px; font:inherit; font-size:17px; border-radius:14px; border:1px solid var(--line); background:var(--bg2); color:var(--ink); }
  a.practice { display:block; text-align:center; color:var(--ink); text-decoration:none; background:var(--bg2); border:1px solid var(--line);
               border-radius:16px; padding:14px; margin:10px 0; font-weight:600; }
  .role[data-role=receiver] { border:3px solid var(--good) !important; }
  .role[data-role=receiver] .i { background:var(--good) !important; }
  /* home: big vertical tiles, like an app screen (icon on top, words below) */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px;
          min-height:180px; margin:0; padding:18px 10px; width:auto; font:inherit; cursor:pointer; text-decoration:none;
          background:var(--card); color:var(--ink); border:2px solid var(--line); border-radius:22px;
          box-shadow:0 3px 12px -6px rgba(23,32,30,.3); transition:transform .1s; }
  .tile:active { transform:scale(.97); }
  .tile .ti { font-size:46px; width:82px; height:82px; display:grid; place-items:center; background:#e6f0ec; border-radius:24px; }
  .tile .tt { font-size:20px; font-weight:800; line-height:1.25; }
  .tile .ts { font-size:15px; color:var(--ink2); line-height:1.35; font-weight:400; }
  .tile.big { grid-column:1 / -1; min-height:220px; border:3px solid var(--good); }
  .tile.big .ti { width:104px; height:104px; font-size:60px; background:var(--good); }
  .tile.big .tt { font-size:25px; }
  .tile.sos { background:#fdecec; border-color:var(--bad); }
  .tile.sos .ti { background:var(--bad); }
  #install { background:var(--bg2); border:1px dashed var(--line); color:var(--ink); font-size:16px; padding:12px; }
</style>

<script>
const params = new URLSearchParams(location.search);
const key = params.get("key") || "";
let role = params.get("role");
const $ = (id) => document.getElementById(id);

// Words on the protected phone, in the language they chose (REVIEW kn/hi with native speakers)
const UI = {
  en: { low: "Safe so far", medium: "Be careful: suspicious call", high: "Likely scam", protected: "🛡️ Protected by Scam Sentinel",
        waiting: "Waiting for the caller…", listening: "Listening · keep the call on speaker near this device", hang: "Hang up",
        stopListen: "Stop listening", banner: "⚠️ SCAM CALL<br>HANG UP NOW", told: "👪 Your family has been told",
        watch: "👪 A family member is watching over this call", stop: "✋ STOP", cut: "🔇 The caller cannot hear you now.",
        ok: "I understand, I will not say it", unmute: "Let the caller hear me again", helpline: "📞 Call 1930 (cyber crime helpline)",
        ended: "Call ended", caller: "Caller", speaker: "Phone call on speaker", voice: "🧬 Spoken in an ",
        tricks: "Tricks spotted", check: "📞 Hang up and call {name} yourself" },
  kn: { low: "ಸದ್ಯಕ್ಕೆ ಸುರಕ್ಷಿತ", medium: "ಎಚ್ಚರ: ಅನುಮಾನಾಸ್ಪದ ಕರೆ", high: "ಮೋಸದ ಕರೆ ಇರಬಹುದು", protected: "🛡️ ಸ್ಕ್ಯಾಮ್ ಸೆಂಟಿನೆಲ್ ರಕ್ಷಣೆಯಲ್ಲಿದೆ",
        waiting: "ಕರೆಗಾಗಿ ಕಾಯುತ್ತಿದೆ…", listening: "ಕೇಳುತ್ತಿದೆ · ಕರೆಯನ್ನು ಸ್ಪೀಕರ್‌ನಲ್ಲಿ ಈ ಸಾಧನದ ಹತ್ತಿರ ಇಡಿ", hang: "ಕರೆ ಕಟ್ ಮಾಡಿ",
        stopListen: "ಕೇಳುವುದನ್ನು ನಿಲ್ಲಿಸಿ", banner: "⚠️ ಮೋಸದ ಕರೆ<br>ಈಗಲೇ ಕರೆ ಕಟ್ ಮಾಡಿ", told: "👪 ನಿಮ್ಮ ಮನೆಯವರಿಗೆ ತಿಳಿಸಲಾಗಿದೆ",
        watch: "👪 ಮನೆಯವರು ಈ ಕರೆಯನ್ನು ಗಮನಿಸುತ್ತಿದ್ದಾರೆ", stop: "✋ ನಿಲ್ಲಿಸಿ", cut: "🔇 ಈಗ ಕರೆ ಮಾಡಿದವರಿಗೆ ನಿಮ್ಮ ಧ್ವನಿ ಕೇಳುವುದಿಲ್ಲ.",
        ok: "ಸರಿ, ನಾನು ಹೇಳುವುದಿಲ್ಲ", unmute: "ಕರೆ ಮಾಡಿದವರಿಗೆ ಮತ್ತೆ ನನ್ನ ಧ್ವನಿ ಕೇಳಿಸಲಿ", helpline: "📞 1930 ಗೆ ಕರೆ ಮಾಡಿ (ಸೈಬರ್ ಅಪರಾಧ ಸಹಾಯವಾಣಿ)",
        ended: "ಕರೆ ಮುಗಿಯಿತು", caller: "ಕರೆ ಮಾಡುತ್ತಿರುವವರು", speaker: "ಸ್ಪೀಕರ್‌ನಲ್ಲಿರುವ ಕರೆ", voice: "🧬 ",
        tricks: "ಕಂಡುಬಂದ ಮೋಸದ ತಂತ್ರಗಳು", check: "📞 ಕರೆ ಕಟ್ ಮಾಡಿ, {name} ಅವರಿಗೆ ನೀವೇ ಕರೆ ಮಾಡಿ" },
  hi: { low: "अभी तक सुरक्षित", medium: "सावधान: संदिग्ध कॉल", high: "धोखाधड़ी कॉल हो सकती है", protected: "🛡️ स्कैम सेंटिनल से सुरक्षित",
        waiting: "कॉल का इंतज़ार…", listening: "सुन रहा है · कॉल को स्पीकर पर इस डिवाइस के पास रखें", hang: "कॉल काटें",
        stopListen: "सुनना बंद करें", banner: "⚠️ धोखाधड़ी कॉल<br>अभी कॉल काटें", told: "👪 आपके घरवालों को बता दिया गया है",
        watch: "👪 घरवाले इस कॉल पर नज़र रख रहे हैं", stop: "✋ रुकिए", cut: "🔇 अब कॉल करने वाला आपकी आवाज़ नहीं सुन सकता।",
        ok: "ठीक है, नहीं बताना है", unmute: "कॉल करने वाले को फिर से मेरी आवाज़ सुनाएँ", helpline: "📞 1930 पर कॉल करें (साइबर अपराध हेल्पलाइन)",
        ended: "कॉल खत्म", caller: "कॉल करने वाला", speaker: "स्पीकर पर कॉल", voice: "🧬 ",
        tricks: "पकड़ी गई चालें", check: "📞 कॉल काटें और {name} को खुद फ़ोन करें" },
};
const COLOR = { low: "var(--good)", medium: "var(--warn)", high: "var(--bad)" };
const ICON = { authority: "👮", threat: "⚠️", urgency: "⏰", secrecy: "🤫", credentials: "🔑", otp_request: "🔢",
               payment: "💸", remote_access: "📲", lure: "🎁" };
const shownTricks = new Set();

let ctx, ws, capture, player, stream, wakeLock, startedAt, timerId, installPrompt;
const warnings = {};
let lang = "kn-IN";
const protectedRole = () => role === "receiver" || role === "listener";
const t = () => (protectedRole() && UI[lang.split("-")[0]]) || UI.en;
const seen = { worst: "low", alerts: [], guard: 0, label: "", caller: [] };   // for the after-call steps

function stored(k, v) {               // remembered on this phone only; browser storage may be unavailable
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; }
}
const prefs = (() => { try { return JSON.parse(stored("sentinel-prefs") || "{}"); } catch (_) { return {}; } })();

function setManifest() {             // "Add to home screen" opens straight into this phone's role

function b64ToBuffer(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }

async function onControl(m) {
  if (m.type === "waiting") setStatus(role === "listener" ? "…" : role === "receiver" ? t().waiting : "Waiting for the other phone…");
  else if (m.type === "connected") {
    startedAt = Date.now();
    setStatus(role === "receiver" ? t().protected : role === "listener" ? t().listening : "Connected");
    if (protectedRole()) showWatch(m.guardians);
    timerId = setInterval(() => { const s = Math.floor((Date.now() - startedAt) / 1000); $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 500);
  } else if (m.type === "warnings") {
    for (const [lvl, b64] of Object.entries(m.audio)) warnings[lvl] = await ctx.decodeAudioData(b64ToBuffer(b64));
  } else if (m.type === "risk") { setRisk(m.level, m.score); showTricks(m.tricks || []); }
  else if (m.type === "guardians") showWatch(m.count);
  else if (m.type === "guard") onGuard(m);
  else if (m.type === "alert") onAlert(m);
  else if (m.type === "error") alertBox(m.message);
  else if (m.type === "ended") end(t().ended + ": " + m.reason);
}

function setRisk(level, score) {

}

}

  if (m.voice) { const s = document.createElement("small"); s.textContent = t().voice + m.voice; div.append(s); }
  $("alerts").prepend(div);
  navigator.vibrate?.(m.level === "high" ? [400, 150, 400, 150, 400] : [300]);
  if (m.level === "high") {
    $("bannermsg").textContent = m.message;
    $("bannervoice").textContent = m.voice ? t().voice + m.voice : "";
    $("bannertype").textContent = m.scam_label || "";
    $("bannerfamily").textContent = m.family_told ? t().told : "";
    $("bannertip").textContent = m.tip || "";
    $("bannertip").classList.toggle("hidden", !m.tip);
    const cname = $("cname").value.trim(), cnum = $("cnum").value.trim().replace(/[^0-9+]/g, "");
    $("bannercheck").classList.toggle("hidden", !cnum);
    if (cnum) { $("bannercheck").textContent = t().check.replace("{name}", cname || "family"); $("bannercheck").href = "tel:" + cnum; }
    $("banner").classList.add("show");
  }
  playWarning(m.level);
}

function alertBox(text) { const d = document.createElement("div"); d.className = "a medium"; d.textContent = text; $("alerts").prepend(d); setStatus(text); }

function hangup() { try { ws?.send(JSON.stringify({ type: "hangup" })); } catch (_) {} end(t().ended); }
$("hang").onclick = hangup;
$("bannerhang").onclick = () => { $("banner").classList.remove("show"); hangup(); };
$("bannercheck").onclick = () => { $("banner").classList.remove("show"); hangup(); };   // then the phone dials them

function end(text) {
  if (startedAt === null) return;
  seen.seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  startedAt = null;
  clearInterval(timerId);
  window.Sentinel?.inCall(false);
  setStatus(text);
  $("hang").disabled = true;
  try { ws?.close(); } catch (_) {}
  stream?.getTracks().forEach((tr) => tr.stop());
  wakeLock?.release?.();
  if (protectedRole() && (seen.worst !== "low" || seen.guard)) showAfter();
}

function showAfter() {
  const a = AFTER[lang.split("-")[0]] || AFTER.en;
  $("banner").classList.remove("show"); $("stop").classList.remove("show");
  $("a-title").textContent = "⚠️ " + a.title;
  $("a-type").textContent = seen.label;
  $("a-q").textContent = a.q;
  $("a-yes").textContent = a.yes; $("a-no").textContent = a.no;
  $("a-copy").textContent = a.copy;
  $("after").classList.remove("hidden");
  $("after").scrollIntoView({ behavior: "smooth" });
  const answer = (shared) => {
    seen.shared = shared;
    const steps = shared ? a.yesSteps : a.noSteps;
    $("a-steps").className = "steps" + (shared ? " urgent" : "");
    $("a-steps").innerHTML = "";
    for (const [href, text] of steps) {
      const el = document.createElement(href ? "a" : "div");
      el.textContent = text;
      if (href) { el.href = href; if (href.startsWith("http")) { el.target = "_blank"; el.rel = "noopener"; } }
      $("a-steps").append(el);
    }
    $("a-copy").classList.remove("hidden");
  };
  $("a-yes").onclick = () => answer(true);
  $("a-no").onclick = () => answer(false);
  $("a-copy").onclick = async () => {
    try { await navigator.clipboard.writeText(report()); $("a-note").textContent = a.copied; }
    catch (_) { try { await navigator.share({ text: report() }); } catch (_) { $("a-note").textContent = report(); } }
  };
}

function report() {
  const m = Math.floor(seen.seconds / 60), s = String(seen.seconds % 60).padStart(2, "0");
  return [
    "Suspected fraud call: Scam Sentinel call report (prototype; simulated test call)",
    `Date and time: ${new Date().toLocaleString("en-IN")}`,
    `Call length: about ${m}:${s}`,
    `Scam type: ${seen.labelEn || "Suspicious call"}`,
    `Warnings given during the call: ${seen.alerts.join(", ") || "none"}`,
    seen.guard ? "The person started saying numbers; Scam Sentinel told them to stop." : "",
    seen.caller.length ? "What the caller said: " + seen.caller.map((c) => `"${c}"`).join(" / ") : "",
    `Shared an OTP, PIN or money: ${seen.shared === undefined ? "not answered" : seen.shared ? "YES" : "no"}`,
    "Caller's number: not captured by this prototype",
  ].filter(Boolean).join("\n");
}
