# Render blueprint: the whole website (pages + live calling line) as one free web service.
# GNANI_API_KEY is entered in the Render dashboard (never in code); SENTINEL_KEY is generated by Render and is
# the private key for the live-call links (?key=...). Practice and Real scams need no key.
services:
  - type: web
    name: scam-sentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: python phone_relay.py
    healthCheckPath: /practice
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: SENTINEL_KEY
        generateValue: true
      # public demo without a key: only the one-phone speakerphone listener, at most this many credits a day
      # (about 16 minutes), each session at most PUBLIC_LIVE_SECONDS; 0 turns it off
      - key: PUBLIC_LIVE_CREDITS
        value: "7"
      - key: PUBLIC_LIVE_SECONDS
        value: "120"
